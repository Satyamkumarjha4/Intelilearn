# The throwaway stack the browser tests run against: `make fake-llm` / `make e2e` (docs/process/testing.md).
#   docker compose -p socra-e2e -f docker-compose.yml -f docker-compose.e2e.yml --profile e2e up -d --build
# It is its own compose project (its own containers and database volume), on its own ports, with no Supabase URL and no
# provider key: the only model is the fake one in tests/e2e/fake_llm_server.py, so nothing here can reach your data or
# cost anything. The registry is loaded from tests/e2e/fake_registry.json, which replaces all routing: never run that
# against the dev stack.
x-e2e-env: &e2e-env
  SUPABASE_DATABASE_URL: ""
  GEMINI_API_KEY: ""
  GROQ_API_KEY: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  FAKE_LLM_API_KEY: fake
  DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:${E2E_FRONTEND_PORT:-7100},http://localhost:${E2E_BACKEND_PORT:-7110}
  # The fake server also answers the media search the lesson build makes, so no test calls the internet.
  WIKIMEDIA_API_URL: http://fake-llm.lan:9000/w/api.php
  MEDIA_ALLOW_PRIVATE_HOSTS: "true"
  # Tests sign up and start lessons in bursts: the production limits would turn a green run red.
  PUBLIC_PAGES_THROTTLE_RATE: 10000/min
  AUTH_THROTTLE_RATE: 10000/min
  AUTH_ACCOUNT_THROTTLE_RATE: 10000/min
  LESSON_CREATE_THROTTLE_RATE: 10000/hour
  CREDITS_QUOTE_THROTTLE_RATE: 10000/min
  CREDITS_BALANCE_THROTTLE_RATE: 10000/min
  # This stack charges and earns for real (the credit gate and the credits sink are the defaults since phase 10.9, so it
  # needs no opt-in), and the credit screens are driven end to end. `make fake-llm` makes the daily credit large, so a
  # learner who has studied is never short.
  # The fake payment gateway (only ever on this stack): the browser "pays" by a signed callback the test sends through the
  # frontend's own address, as a provider would. The secret is not a real one.
  # payments.E004 refuses the fake gateway unless DEBUG is on, so this stack says so itself (a CI run has no .env).
  DJANGO_DEBUG: "true"
  PAYMENT_ALLOW_FAKE_GATEWAY: "true"
  # `make e2e-payments` swaps in `stripe` or `razorpay` (a provider's test mode) for these two; the usual stack is fake only.
  PAYMENT_GATEWAYS_ENABLED: ${E2E_PAYMENT_GATEWAYS:-fake}
  PAYMENT_DEFAULT_GATEWAY: ${E2E_PAYMENT_DEFAULT:-fake}
  # Stripe's webhook secret is only used by the endpoint that Stripe calls, which that run does not need (the return page
  # asks Stripe itself), but a gateway is not switched on without one. A real one in .env is passed through.
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_not_used_by_this_stack}
  # The same for Razorpay: its webhook secret is not needed by a run that lets the return page ask Razorpay itself.
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-not_used_by_this_stack}
  PAYMENT_FAKE_GATEWAY_SECRET: ${PAYMENT_FAKE_GATEWAY_SECRET:-e2e-fake-gateway-secret}
  PAYMENT_RETURN_BASE_URL: http://localhost:${E2E_FRONTEND_PORT:-7100}
  PAYMENT_ORDER_THROTTLE_RATE: 10000/hour
  PAYMENT_STATUS_THROTTLE_RATE: 10000/min
  PAYMENT_WEBHOOK_THROTTLE_RATE: 10000/min

services:
  # Nothing but the app and its API is published: the dev stack owns the usual database and Redis ports.
  db:
    ports: !reset []
  redis:
    ports: !reset []
  backend:
    environment: *e2e-env
    ports: !override
      - "127.0.0.1:${E2E_BACKEND_PORT:-7110}:8000"
  worker:
    environment: *e2e-env
  beat:
    environment: *e2e-env
  frontend:
    ports: !override
      - "127.0.0.1:${E2E_FRONTEND_PORT:-7100}:3000"
