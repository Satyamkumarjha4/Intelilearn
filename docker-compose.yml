# Local development stack. All values come from the root .env (see .env.example); every one has a
# default, so `docker compose up` also works with no .env (e.g. in CI).
#   make up        App: http://localhost:${FRONTEND_PORT}   Swagger: http://localhost:${BACKEND_PORT}/api/docs
#
# Published ports bind to BIND_ADDRESS (default 127.0.0.1), so Postgres, Redis and the API are not reachable
# from your LAN. Set BIND_ADDRESS=0.0.0.0 only if you really need that.
#
# Database: the `db` service, unless SUPABASE_DATABASE_URL is set. Then the backend uses Supabase
# and first copies local rows up to it on every start (see docs/local-setup.md).

x-backend: &backend
  build:
    context: ./backend
    additional_contexts:
      sandbox: ./sandbox # the Node package for the lesson-code checks
  env_file:
    - path: ./.env
      required: false
  environment:
    # containers reach the services by name, on their internal ports
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-lessoncrafter}
    POSTGRES_USER: ${POSTGRES_USER:-lessoncrafter}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lessoncrafter}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    FAKE_LLM_API_KEY: ${FAKE_LLM_API_KEY:-}
  volumes:
    - ./backend:/app:z # :z relabels for SELinux (Fedora) so containers can read the bind mount
    - ./tests:/tests:z # repo-root tests, mirroring backend/
    - ./sandbox:/sandbox:z # check.mjs and, later, render-check.mjs
    - /sandbox/node_modules # the image's packages stay visible under the bind mount
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lessoncrafter}
      POSTGRES_USER: ${POSTGRES_USER:-lessoncrafter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lessoncrafter}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", 'exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}']
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # authenticate only when a password is set (an empty REDISCLI_AUTH would make every call fail AUTH)
      test: ["CMD-SHELL", '[ -z "$$REDIS_PASSWORD" ] || export REDISCLI_AUTH="$$REDIS_PASSWORD"; redis-cli ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    <<: *backend
    # bootstrap = migrate (and, with Supabase, sync local → Supabase first)
    command: >
      sh -c "python manage.py bootstrap &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload --lifespan off"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"

  worker:
    <<: *backend
    # watchfiles restarts the worker when Python files change
    command: watchfiles --filter python "celery -A config worker -l info --concurrency 4" /app

  # Dev-only stand-in for an LLM provider (profile `e2e`; see `make fake-llm` and docs/local-setup.md).
  fake-llm:
    profiles: ["e2e"]
    build:
      context: ./backend
      additional_contexts:
        sandbox: ./sandbox
    command: python /tests/e2e/fake_llm_server.py
    networks:
      default:
        aliases: [fake-llm.lan] # the registry's base_url must look like a domain name
    environment:
      PYTHONPATH: /app:/tests
      FAKE_LLM_PORT: 9000
    volumes:
      - ./backend:/app:z
      - ./tests:/tests:z

  frontend:
    build: ./frontend
    environment:
      DJANGO_API_ORIGIN: http://backend:8000
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:${BACKEND_PORT:-8000}}
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
      - /app/.next
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
