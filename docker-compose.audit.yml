# The throwaway stack the pre-launch audit runs against: `make audit-up MODE=mock|live` / `make audit-down`
# (docs/process/testing.md, "The audit stack").
#   docker compose -p socra-audit -f docker-compose.yml -f docker-compose.audit.yml [-f docker-compose.audit-mock.yml --profile e2e] up -d --build
# Its own project, containers, database volume and ports, no Supabase URL, the fake payment gateway, the outbox mailer
# and the stand-in Google provider: nothing here can reach real data, send mail or take money.
#
# Unlike the browser-test stack (docker-compose.e2e.yml) it does NOT raise the throttles or the credit settings: the
# audit judges the production limits and prices, so they stay at their defaults.
#
# This file is for DJANGO_DEBUG=true stacks only (the fake gateway and the outbox refuse to start otherwise).
x-audit-env: &audit-env
  SUPABASE_DATABASE_URL: ""
  DJANGO_DEBUG: "true"
  DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:${AUDIT_FRONTEND_PORT:-7200},http://localhost:${AUDIT_BACKEND_PORT:-7210}
  # The fake gateway is the only way to pay, in both modes. A real provider key in .env must not reach this stack.
  PAYMENT_ALLOW_FAKE_GATEWAY: "true"
  PAYMENT_GATEWAYS_ENABLED: fake
  PAYMENT_DEFAULT_GATEWAY: fake
  PAYMENT_FAKE_GATEWAY_SECRET: ${AUDIT_FAKE_GATEWAY_SECRET:-audit-fake-gateway-secret}
  PAYMENT_RETURN_BASE_URL: http://localhost:${AUDIT_FRONTEND_PORT:-7200}
  PAYMENTS_LIVE_MODE: "false"
  STRIPE_SECRET_KEY: ""
  STRIPE_PUBLISHABLE_KEY: ""
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  # Sign-in codes are read from the mail log (outbox); nothing is ever sent.
  MAIL_BACKEND: outbox
  MAIL_ALLOW_OUTBOX: "true"
  # The stand-in Google: the real callback, state check and cookies run.
  AUTH_PROVIDERS_ENABLED: fake
  AUTH_ALLOW_FAKE_PROVIDER: "true"
  AUTH_PUBLIC_BASE_URL: http://localhost:${AUDIT_FRONTEND_PORT:-7200}
  # No sign-up challenge: nobody can pass one in a script, and the console's switch must refuse to go on without keys.
  TURNSTILE_SITE_KEY: ""
  TURNSTILE_SECRET_KEY: ""
  # The persona password (generated by `make audit-up`, kept in docs/audit/<run>/personas.local) and the live budget.
  AUDIT_PERSONA_PASSWORD: ${AUDIT_PERSONA_PASSWORD:-}
  LIVE_MAX_COST_USD: ${LIVE_MAX_COST_USD:-2.00}

services:
  # Nothing but the app and its API is published, on the audit's own ports.
  db:
    ports: !reset []
    mem_limit: 512m
  redis:
    ports: !reset []
    mem_limit: 128m
  backend:
    environment: *audit-env
    ports: !override
      - "127.0.0.1:${AUDIT_BACKEND_PORT:-7210}:8000"
    mem_limit: 1g
  worker:
    environment: *audit-env
    # Two processes, not four: the machine is short of memory, and an audit builds one lesson at a time.
    command: watchfiles --filter python "celery -A config worker -l info --concurrency 2" /app
    mem_limit: 1g
  beat:
    environment: *audit-env
    mem_limit: 256m
  frontend:
    ports: !override
      - "127.0.0.1:${AUDIT_FRONTEND_PORT:-7200}:3000"
    mem_limit: 1536m
