[project]
name = "lessoncrafter-backend"
version = "0.1.0"
description = "Lesson Crafter API: Django, DRF, Celery, LangGraph"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6.3",
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular[sidecar]>=0.30.0",
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.4",
    "langchain-core>=1.6.5",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "redis>=6.4.0",
    "uvicorn[standard]>=0.54.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
# Tests live in the repo-root tests/ folder, mirroring backend/ (mounted at /tests in docker).
testpaths = ["../tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
